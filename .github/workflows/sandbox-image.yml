name: Build verified learning sandbox image
on:
  workflow_dispatch:
    inputs:
      verified_image:
        description: 'Optional previously verified StudySolo image digest for renderer evidence only'
        required: false
        default: ''
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build only approved runtime and skill assets
        env:
          VERIFIED_IMAGE: ${{ inputs.verified_image }}
        run: |
          if test -n "$VERIFIED_IMAGE"; then
            if [[ ! "$VERIFIED_IMAGE" =~ ^ghcr.io/aimfllyys/studysolo-skills@sha256:[a-f0-9]{64}$ ]]; then exit 2; fi
            IMAGE="$VERIFIED_IMAGE"
            docker pull "$IMAGE"
          else
            IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/studysolo-skills:${GITHUB_SHA}"
            docker build -f scripts/sandbox/Dockerfile -t "$IMAGE" .
          fi
          docker run --rm --entrypoint /bin/bash "$IMAGE" -c 'test -f /opt/studysolo/runtime-ready.json && /opt/studysolo/bin/python3 -c "import docx,pypdf,pypdfium2,PIL,numpy,pdf2image,reportlab,pdfplumber" && NODE_PATH=/opt/studysolo/node_modules node -e "require(\"playwright\"); require(\"docx\")" && command -v pdftoppm && command -v libreoffice'
          mkdir -p "$RUNNER_TEMP/sandbox-renderer-qa"
          chmod 0777 "$RUNNER_TEMP/sandbox-renderer-qa"
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --user 10001:10001 --entrypoint /bin/bash -v "$RUNNER_TEMP/sandbox-renderer-qa:/tmp/studysolo-qa" "$IMAGE" /opt/studysolo/verify-renderers.sh /tmp/studysolo-qa
          printf 'IMAGE=%s\n' "$IMAGE" >> "$GITHUB_ENV"
      - name: Publish immutable image
        if: inputs.verified_image == ''
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
      - name: Record image reference
        run: printf 'Verified dependency image `%s`. Template/runtime QA still required.\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Export only synthetic document evidence
        if: always()
        run: |
          SOURCE="$RUNNER_TEMP/sandbox-renderer-qa"
          EXPORT="$RUNNER_TEMP/sandbox-renderer-evidence"
          mkdir -p "$EXPORT"
          for NAME in handbook.pdf manuscript.pdf manuscript.docx preflight.json; do
            if test -f "$SOURCE/$NAME"; then cp "$SOURCE/$NAME" "$EXPORT/$NAME"; fi
          done
          for NAME in handbook-pages manuscript-pages; do
            if test -d "$SOURCE/$NAME"; then
              mkdir -p "$EXPORT/$NAME"
              for PAGE in "$SOURCE/$NAME"/*.png; do
                if test -f "$PAGE"; then cp "$PAGE" "$EXPORT/$NAME/"; fi
              done
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-renderer-qa
          path: ${{ runner.temp }}/sandbox-renderer-evidence
          if-no-files-found: ignore
