<div class="page"><h1>糖代谢复习与血糖<span style="color:#A2630C">可视化</span></h1>
<h2>血糖标准</h2>
<table><tr><th>指标</th><th>数值</th></tr>
<tr><td>空腹正常</td><td>3.9-6.0 mmol/L</td></tr>
<tr><td>低血糖</td><td>&lt;2.8</td></tr>
<tr><td>糖尿病</td><td>空腹≥7.0</td></tr></table>
<h2>糖尿病分型</h2>
<table><tr><th>类型</th><th>病因</th></tr>
<tr><td>1型</td><td>胰岛素分泌不足</td></tr>
<tr><td>2型</td><td>胰岛素抵抗</td></tr></table>
<div class="tip">所有物质彻底氧化→乙酰CoA→TCA。乳酸可被心肌直接利用。</div>
