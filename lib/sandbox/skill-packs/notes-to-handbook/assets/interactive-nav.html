<!--
  interactive-nav.html — optional HTML-only navigation layer.
  See references/advanced-techniques.md §7 before using this.

  What this is: a right-side scrollspy chapter rail + a Cmd/Ctrl-K search
  overlay, both driven by a single JSON data array you generate alongside
  your document's content (see §6 of the same doc — build this array as a
  side effect of rendering, don't scrape it after the fact).

  How to use:
  1. Copy the <style> block into your document's stylesheet, adjusting the
     custom-property names (--paper/--ink/--accent-x) to match your actual
     token names from Phase 2.
  2. Copy the two markup blocks (<nav class="side-index">... and the search
     button + overlay) into your document body, once each, near the end.
  3. Give every chapter section, article block, and searchable row a stable
     `id` attribute — the rail's `data-target` and the search index's `id`
     field both reference these directly via getElementById.
  4. Replace `__CHAPTERS__` and `__SEARCH_DATA__` below with your real data
     (a Python/JS build step doing simple string replacement is enough —
     see the render-time SEARCH_INDEX pattern in advanced-techniques.md §6).
  5. THIS ENTIRE LAYER MUST BE INVISIBLE IN PRINT — the @media print rule
     at the bottom of the <style> block is not optional. Re-run
     scripts/check_pdf_pages.py after integrating to confirm no leaked ink.
-->

<style>
  @media screen { html{ scroll-behavior:smooth; } }

  .side-index{
    position:fixed; right:18px; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; align-items:center; gap:13px;
    z-index:500;
  }
  .side-index-line{
    position:absolute; left:50%; top:-6px; bottom:-6px; width:1px;
    background:var(--rule); transform:translateX(-50%); z-index:-1;
  }
  .side-index-item{
    position:relative; display:flex; flex-direction:column; align-items:center;
    text-decoration:none; padding:2px; cursor:pointer;
  }
  .side-index-item .dot{
    width:7px; height:7px; border-radius:50%; background:var(--paper);
    border:1.6px solid var(--dot); transition:all .18s ease;
  }
  .side-index-item .lab{
    font-family:monospace; font-size:6.6px; color:var(--ink-faint); margin-top:3px;
    transition:color .18s ease;
  }
  .side-index-item:hover .dot, .side-index-item.active .dot{
    background:var(--dot); transform:scale(1.35);
  }
  .side-index-item.active .lab{ color:var(--dot); font-weight:700; }
  .side-index-item .flyout{
    position:absolute; right:100%; top:50%; margin-right:11px;
    transform:translateY(-50%) translateX(4px);
    white-space:nowrap; background:#FFFFFF; border:1px solid var(--rule);
    border-radius:4px; padding:5px 10px; font-size:11px; color:var(--ink);
    box-shadow:0 6px 18px rgba(20,20,20,.09);
    opacity:0; pointer-events:none; transition:opacity .15s ease, transform .15s ease;
  }
  .side-index-item:hover .flyout{ opacity:1; transform:translateY(-50%) translateX(0); }

  .search-fab{
    position:fixed; left:20px; bottom:20px; z-index:600;
    width:42px; height:42px; border-radius:50%;
    background:#FFFFFF; border:1px solid var(--rule);
    box-shadow:0 2px 10px rgba(20,20,20,.08);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;
    color:var(--ink-soft);
  }
  .search-fab:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(20,20,20,.14); }
  .search-fab svg{ width:17px; height:17px; }

  .search-overlay{ position:fixed; inset:0; z-index:1000; display:none; }
  .search-overlay.open{ display:block; }
  .search-backdrop{ position:absolute; inset:0; background:rgba(28,30,25,.38); backdrop-filter:blur(3px); }
  .search-panel{
    position:relative; width:min(600px,88vw); margin:11vh auto 0;
    background:#FFFFFF; border-radius:11px; overflow:hidden;
    box-shadow:0 30px 70px rgba(15,15,10,.30); border:1px solid var(--rule);
    display:flex; flex-direction:column; max-height:70vh;
  }
  .search-input-row{ display:flex; align-items:center; gap:10px; padding:15px 18px; border-bottom:1px solid var(--rule); }
  .search-input-row input{ flex:1; border:none; outline:none; font-size:14.5px; color:var(--ink); background:transparent; }
  .search-esc{ font-family:monospace; font-size:9px; color:var(--ink-faint); border:1px solid var(--rule); border-radius:3px; padding:2px 5px; }
  .search-results{ overflow-y:auto; flex:1; }
  .search-result{ display:flex; gap:11px; align-items:flex-start; padding:10px 18px; cursor:pointer; border-bottom:1px solid var(--rule); }
  .search-result:hover, .search-result.sel{ background:rgba(0,0,0,.03); }
  .search-result .chip{ flex:none; margin-top:2px; width:26px; height:16px; border-radius:3px; display:flex; align-items:center; justify-content:center; font-family:monospace; font-size:7px; font-weight:700; color:#fff; }
  .search-result .r-title{ font-weight:700; font-size:12.5px; color:var(--ink); }
  .search-result .r-title mark{ background:transparent; font-weight:700; text-decoration:underline; }
  .search-result .r-snip{ font-size:10.6px; color:var(--ink-soft); }
  .search-empty, .search-noresult{ padding:34px 18px; text-align:center; color:var(--ink-faint); font-size:12px; }

  .flash-hit{ animation:flashHit 1.6s ease; }
  @keyframes flashHit{ 0%{ background:rgba(184,134,43,.24); } 100%{ background:transparent; } }

  @media print{
    .side-index, .search-fab, .search-overlay{ display:none !important; }
  }
  @media (max-width: 900px){ .side-index{ display:none; } }
</style>

<!-- ============ scrollspy rail — one <a> per chapter ============ -->
<nav class="side-index" id="sideIndex" aria-label="chapter index">
  <div class="side-index-line"></div>
  <!--
    __CHAPTERS__ — repeat this block once per chapter:
    <a class="side-index-item" data-target="CHAPTER_ID" style="--dot:ACCENT_COLOR">
      <span class="dot"></span>
      <span class="lab">SHORT_NUM</span>
      <span class="flyout">CHAPTER_TITLE</span>
    </a>
  -->
</nav>

<!-- ============ search button + overlay ============ -->
<button class="search-fab" id="searchFab" title="Search (Cmd/Ctrl K)" aria-label="Search">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <circle cx="10.3" cy="10.3" r="6.3"/><line x1="15" y1="15" x2="20.2" y2="20.2"/>
  </svg>
</button>
<div class="search-overlay" id="searchOverlay">
  <div class="search-backdrop" id="searchBackdrop"></div>
  <div class="search-panel">
    <div class="search-input-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <circle cx="10.3" cy="10.3" r="6.3"/><line x1="15" y1="15" x2="20.2" y2="20.2"/>
      </svg>
      <input id="searchInput" type="text" placeholder="Search…" autocomplete="off"/>
      <span class="search-esc">ESC</span>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<script>
(function(){
  var DATA = __SEARCH_DATA__;              // [{id, kind, title, snippet, chapter, chip_color}, ...]
  var KIND_LABEL = {chapter:"chapter", article:"section", term:"entry"};

  /* ---------- scrollspy ---------- */
  var items = Array.prototype.slice.call(document.querySelectorAll(".side-index-item"));
  items.forEach(function(it){
    it.addEventListener("click", function(e){
      e.preventDefault();
      var el = document.getElementById(it.getAttribute("data-target"));
      if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    });
  });
  var sections = items.map(function(it){ return document.getElementById(it.getAttribute("data-target")); }).filter(Boolean);
  if("IntersectionObserver" in window && sections.length){
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        var idx = sections.indexOf(entry.target);
        if(idx === -1 || !entry.isIntersecting) return;
        items.forEach(function(it){ it.classList.remove("active"); });
        items[idx].classList.add("active");
      });
    }, { rootMargin: "-40% 0px -55% 0px", threshold: 0 });
    sections.forEach(function(s){ obs.observe(s); });
  }

  /* ---------- search ---------- */
  var fab = document.getElementById("searchFab"), overlay = document.getElementById("searchOverlay"),
      backdrop = document.getElementById("searchBackdrop"), input = document.getElementById("searchInput"),
      results = document.getElementById("searchResults"), selIndex = -1, currentList = [];

  function openSearch(){ overlay.classList.add("open"); input.value=""; renderResults(""); setTimeout(function(){input.focus();},30); }
  function closeSearch(){ overlay.classList.remove("open"); }
  fab.addEventListener("click", openSearch);
  backdrop.addEventListener("click", closeSearch);
  document.addEventListener("keydown", function(e){
    var mod = e.metaKey || e.ctrlKey;
    if(mod && e.key.toLowerCase()==="k"){ e.preventDefault(); overlay.classList.contains("open")?closeSearch():openSearch(); }
    else if(e.key==="Escape" && overlay.classList.contains("open")) closeSearch();
    else if(overlay.classList.contains("open") && (e.key==="ArrowDown"||e.key==="ArrowUp")){ e.preventDefault(); moveSelection(e.key==="ArrowDown"?1:-1); }
    else if(overlay.classList.contains("open") && e.key==="Enter"){ if(selIndex>=0 && currentList[selIndex]) openResult(currentList[selIndex]); }
  });

  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function mark(t,q){ if(!q) return esc(t); var i=t.toLowerCase().indexOf(q.toLowerCase()); if(i===-1) return esc(t);
    return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length)); }

  function renderResults(q){
    q = q.trim(); selIndex = -1;
    if(!q){ results.innerHTML = '<div class="search-empty">Type to search…  ↑↓ select · Enter jump · Esc close</div>'; currentList=[]; return; }
    var qq=q.toLowerCase(), scored=[];
    DATA.forEach(function(d){
      var t=d.title.toLowerCase(), s=d.snippet.toLowerCase(), c=d.chapter.toLowerCase(), score=-1;
      if(t.indexOf(qq)===0) score=0; else if(t.indexOf(qq)>-1) score=1;
      else if(s.indexOf(qq)>-1) score=2; else if(c.indexOf(qq)>-1) score=3;
      if(score>-1) scored.push([score,d]);
    });
    scored.sort(function(a,b){return a[0]-b[0];});
    currentList = scored.slice(0,40).map(function(x){return x[1];});
    if(!currentList.length){ results.innerHTML = '<div class="search-noresult">No results for "'+esc(q)+'"</div>'; return; }
    results.innerHTML = currentList.map(function(d,i){
      return '<div class="search-result" data-i="'+i+'">'+
        '<span class="chip" style="background:'+(d.chip_color||"#888")+'">'+esc((d.num||"")+"")+'</span>'+
        '<span><span class="r-title">'+mark(d.title,q)+'</span><br/>'+
        '<span class="r-snip">'+esc(d.snippet)+'</span><br/>'+
        '<span class="r-snip">'+esc(KIND_LABEL[d.kind]||d.kind)+' · '+esc(d.chapter)+'</span></span></div>';
    }).join("");
    Array.prototype.slice.call(results.querySelectorAll(".search-result")).forEach(function(el){
      el.addEventListener("click", function(){ openResult(currentList[parseInt(el.getAttribute("data-i"),10)]); });
    });
  }
  function moveSelection(dir){
    if(!currentList.length) return;
    selIndex = (selIndex+dir+currentList.length)%currentList.length;
    Array.prototype.slice.call(results.querySelectorAll(".search-result")).forEach(function(el,i){ el.classList.toggle("sel", i===selIndex); });
    var sel = results.querySelector(".search-result.sel"); if(sel) sel.scrollIntoView({block:"nearest"});
  }
  function openResult(d){
    closeSearch();
    var el = document.getElementById(d.id); if(!el) return;
    setTimeout(function(){
      el.scrollIntoView({behavior:"smooth", block:"center"});
      el.classList.add("flash-hit");
      setTimeout(function(){ el.classList.remove("flash-hit"); }, 1650);
    }, 60);
  }
  input.addEventListener("input", function(){ renderResults(input.value); });
})();
</script>
